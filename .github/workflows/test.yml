name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ["self-hosted","Linux","ARM64","workman-ci"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Verify tests, privacy boundary, and nine-model v2 evidence
        run: python scripts/verify_release.py
      - name: Validate admitted community results
        run: python scripts/validate_community_results.py
